           switchport trunk encapsulation dot1q
           switchport mode trunk
           switchport trunk allowed vlan 10,20,50
           switchport trunk native vlan 99
           no shutdown
          !
          interface Port-channel1
           description LACP_ETHERCHANNEL_TO_SMLC-HQ-CoreSW2
           switchport trunk encapsulation dot1q
           switchport mode trunk
           switchport trunk allowed vlan 10,20,50,99
          !
          interface Vlan10
           description MANAGEMENT_SVI
           ip address 172.16.10.3 255.255.255.0
           ip helper-address 10.10.10.10
           ip helper-address 10.10.10.11
           standby version 2
           standby 10 ip 172.16.10.1
           standby 10 priority 110
           standby 10 preempt delay minimum 30
           standby 10 timers 3 10
           no shutdown
          !
          interface Vlan20
           description LAN_VOICE_SVI
           ip address 172.16.20.3 255.255.252.0
           ip helper-address 10.10.10.10
           ip helper-address 10.10.10.11
           standby version 2
           standby 20 ip 172.16.20.1
           standby 20 priority 110
           standby 20 preempt delay minimum 30
           standby 20 timers 3 10
           no shutdown
          !
          interface Vlan50
           description WLAN_SVI
           ip address 172.16.50.3 255.255.252.0
           ip helper-address 10.10.10.10
           ip helper-address 10.10.10.11
           standby version 2
           standby 50 ip 172.16.50.1
           standby 50 priority 110
           standby 50 preempt delay minimum 30
           standby 50 timers 3 10
           no shutdown
          !
          interface Vlan99
           description BLACKHOLE_NATIVE
           no ip address
           shutdown
          !
          router ospf 15
           router-id 2.2.2.1
           log-adjacency-changes
           passive-interface default
           no passive-interface GigabitEthernet0/0
           no passive-interface GigabitEthernet0/1
           network 10.10.0.0 0.0.0.3 area 0
           network 10.10.0.8 0.0.0.3 area 0
           network 172.16.10.0 0.0.0.255 area 0
           network 172.16.20.0 0.0.3.255 area 0
           network 172.16.50.0 0.0.3.255 area 0
          !
          ip classless
          !
          access-list 10 permit 172.16.10.0 0.0.0.255
          access-list 10 deny any
          !
          banner motd ^UNAUTHORISED ACCESS IS PROHIBITED - SMLC-HQ-CoreSW1^
          !
          line con 0
           exec-timeout 5 0
           login local
          line vty 0 4
           access-class 10 in
           login local
           transport input ssh
          line vty 5 15
           access-class 10 in
           login local
           transport input ssh
          !
