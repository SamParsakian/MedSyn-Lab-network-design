          spanning-tree mode rapid-pvst
          spanning-tree extend system-id
          !
          vlan 10
           name Management
          !
          vlan 20
           name LAN-Voice
          !
          vlan 50
           name WLAN
          !
          vlan 99
           name BLACKHOLE
          !
          interface GigabitEthernet0/0
           description LINK_TO_SMLC-HQ-FW1_INSIDE1
           no switchport
           ip address 10.10.0.1 255.255.255.252
           no shutdown
          !
          interface GigabitEthernet0/1
           description LINK_TO_SMLC-HQ-FW2_INSIDE1
           no switchport
           ip address 10.10.0.9 255.255.255.252
           no shutdown
          !
          interface GigabitEthernet0/2
           description TRUNK_TO_SMLC-HQ-MgmtAdmin-SW1
           switchport trunk encapsulation dot1q
           switchport mode trunk
           switchport trunk allowed vlan 10,20,50
           switchport trunk native vlan 99
           spanning-tree portfast trunk
           no shutdown
          !
          interface GigabitEthernet0/3
           description TRUNK_TO_SMLC-HQ-BizOps-SW1
           switchport trunk encapsulation dot1q
           switchport mode trunk
           switchport trunk allowed vlan 10,20,50
           switchport trunk native vlan 99
           no shutdown
          !
          interface GigabitEthernet1/0
           description TRUNK_TO_SMLC-HQ-Finance-SW1
           switchport trunk encapsulation dot1q
           switchport mode trunk
           switchport trunk allowed vlan 10,20,50
           switchport trunk native vlan 99
           no shutdown
          !
          interface GigabitEthernet1/1
           description TRUNK_TO_SMLC-HQ-TechOps-SW1
           switchport trunk encapsulation dot1q
           switchport mode trunk
           switchport trunk allowed vlan 10,20,50
           switchport trunk native vlan 99
           no shutdown
          !
          interface GigabitEthernet1/2
           description ACCESS_TO_HQ_WLC_VLAN50
           switchport access vlan 50
           switchport mode access
           spanning-tree portfast
           spanning-tree bpduguard enable
           no shutdown
          !
          interface GigabitEthernet1/3
           description ETHERCHANNEL_TO_SMLC-HQ-CoreSW2_LINK1
           switchport trunk encapsulation dot1q
           switchport mode trunk
           switchport trunk allowed vlan 10,20,50,99
           channel-group 1 mode active
           no shutdown
          !
          interface GigabitEthernet2/0
           description ETHERCHANNEL_TO_SMLC-HQ-CoreSW2_LINK2
           switchport trunk encapsulation dot1q
           switchport mode trunk
           switchport trunk allowed vlan 10,20,50,99
           channel-group 1 mode active
           no shutdown
