nodes:
  - boot_disk_size: null
    configuration:
      - name: day0-config
        content: |-
          hostname SMLC-HQ-FW1
          domain-name medsyn.lab
          !
          same-security-traffic permit inter-interface
          same-security-traffic permit intra-interface
          !
          passwd MedSyn@2024
          enable password MedSyn@2024
          !
          interface GigabitEthernet0/0
           nameif INSIDE1
           security-level 100
           ip address 10.10.0.2 255.255.255.252
           no shutdown
          !
          interface GigabitEthernet0/1
           nameif INSIDE2
           security-level 100
           ip address 10.10.0.6 255.255.255.252
           no shutdown
          !
          interface GigabitEthernet0/2
           nameif DMZ
           security-level 70
           ip address 10.10.10.1 255.255.255.192
           no shutdown
          !
          interface GigabitEthernet0/3
           nameif OUTSIDE
           security-level 0
           ip address 203.0.113.2 255.255.255.252
           no shutdown
          !
          interface GigabitEthernet0/4
           nameif OUTSIDE2
           security-level 0
           ip address 203.0.113.14 255.255.255.252
           no shutdown
          !
          route OUTSIDE 0.0.0.0 0.0.0.0 203.0.113.1 1
          !
          object network HQ-MGMT-INSIDE1
           subnet 172.16.10.0 255.255.255.0
           nat (INSIDE1,OUTSIDE) dynamic interface
          !
          object network HQ-LAN-INSIDE1
           subnet 172.16.20.0 255.255.252.0
           nat (INSIDE1,OUTSIDE) dynamic interface
          !
          object network HQ-WLAN-INSIDE1
           subnet 172.16.48.0 255.255.252.0
           nat (INSIDE1,OUTSIDE) dynamic interface
          !
          object network HQ-MGMT-INSIDE2
           subnet 172.16.10.0 255.255.255.0
           nat (INSIDE2,OUTSIDE) dynamic interface
          !
          object network HQ-LAN-INSIDE2
           subnet 172.16.20.0 255.255.252.0
           nat (INSIDE2,OUTSIDE) dynamic interface
          !
          object network HQ-WLAN-INSIDE2
           subnet 172.16.48.0 255.255.252.0
           nat (INSIDE2,OUTSIDE) dynamic interface
          !
          access-list RES-ACCESS extended permit ospf any any
          access-list RES-ACCESS extended permit icmp any any
          access-list RES-ACCESS extended permit tcp any any eq www
          access-list RES-ACCESS extended permit tcp any any eq https
          access-list RES-ACCESS extended permit tcp any any eq smtp
          access-list RES-ACCESS extended permit tcp any any eq ftp
          access-list RES-ACCESS extended permit tcp any any eq 21
          access-list RES-ACCESS extended permit udp any any eq domain
          access-list RES-ACCESS extended permit tcp any any eq domain
          access-list RES-ACCESS extended permit udp any any eq bootps
          access-list RES-ACCESS extended permit udp any any eq bootpc
          !
          access-group RES-ACCESS in interface OUTSIDE
          access-group RES-ACCESS in interface OUTSIDE2
          access-group RES-ACCESS in interface DMZ
          !
          router ospf 15
           router-id 1.1.1.1
           default-information originate always
           log-adj-changes
           network 10.10.0.0 255.255.255.252 area 0
           network 10.10.0.4 255.255.255.252 area 0
           network 10.10.10.0 255.255.255.192 area 0
           network 203.0.113.0 255.255.255.252 area 0
           network 203.0.113.12 255.255.255.252 area 0
          !
          telnet timeout 5
          ssh timeout 5
