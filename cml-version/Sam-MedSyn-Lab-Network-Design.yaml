lab:
  description: MedSyn Company LAN - Full topology. All nodes powered OFF. No configuration
    applied yet. Based on Cisco Packet Tracer final project.
  notes: '27 nodes, 42 links. HQ site: 2x ASAv firewalls, 2x IOSvL2 multilayer switches,
    DMZ switch, 6 servers, ISP1, ISP2, 4 access switches, WLC placeholder. Internet
    core router + cloud switch. Branch site: firewall, 2x multilayer switches, 2 access
    switches, WLC placeholder. Configure devices one at a time (max 5 nodes ON simultaneously
    - CML FREE license). DO NOT START ANY NODE before configuration is applied.'
  title: Sam-MedSyn-Lab-Network-Design
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
